worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_max_body_size 8m;
  proxy_temp_path /tmp/proxy;
  client_body_temp_path /tmp/client;
  server {
    listen 8080;
    server_name _;
    root /opt/management-static;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-A2Flow-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_buffering off;
    proxy_read_timeout 180s;
    location = /healthz { default_type text/plain; return 200 "gateway ready\n"; }
    location = / { return 302 /employee/; }
    location = /login { proxy_pass http://127.0.0.1:8780; }
    location = /logout { proxy_pass http://127.0.0.1:8780; }
    location /api/internal/ { return 404; }
    location /api/management/ { proxy_pass http://127.0.0.1:8790; }
    location /api/ { proxy_pass http://127.0.0.1:8785; }
    location /employee/ { alias /opt/employee-static/; try_files $uri $uri/ /employee/index.html; }
    location /assets/ { root /opt/management-static; }
    location /management { root /opt/management-static; try_files $uri /index.html; }
    location /examples/ { alias /opt/examples/; }
  }
}
