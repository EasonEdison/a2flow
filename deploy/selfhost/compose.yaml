x-application: &application
  image: a2flow-selfhost-python:${A2FLOW_IMAGE_TAG:-local}
  build: {context: ../.., dockerfile: deploy/selfhost/Dockerfile, target: python}
  user: "${A2FLOW_APP_UID:?run configure.py}:${A2FLOW_APP_GID:?run configure.py}"
  network_mode: service:gateway
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    gateway: {condition: service_started}

services:
  gateway:
    image: a2flow-selfhost-gateway:${A2FLOW_IMAGE_TAG:-local}
    build: {context: ../.., dockerfile: deploy/selfhost/Dockerfile, target: gateway}
    ports: ["127.0.0.1:${A2FLOW_HTTP_PORT:-18080}:8080"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777", "/var/cache/nginx:size=16m", "/var/run:size=1m"]
    restart: unless-stopped
  postgres:
    image: postgres:16.6-bookworm
    network_mode: none
    environment:
      POSTGRES_DB: ${A2FLOW_DB_PREFIX:?run configure.py}_bootstrap
      POSTGRES_USER: ${A2FLOW_DB_PREFIX}_bootstrap
      POSTGRES_PASSWORD_FILE: /run/bootstrap-password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256
    command: [postgres, -c, "listen_addresses=", -c, "unix_socket_directories=/run/postgresql", -c, "shared_buffers=64MB", -c, "max_connections=60"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/run/postgresql
      - ${A2FLOW_PRIVATE:?run configure.py}/postgres_password:/run/bootstrap-password:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h /run/postgresql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    network_mode: service:gateway
    command: [redis-server, --bind, 127.0.0.1, --appendonly, 'yes', --save, '60', '1']
    volumes: [redis_data:/data]
    depends_on: [gateway]
    restart: unless-stopped
  initialize:
    <<: *application
    profiles: [tools]
    volumes:
      - postgres_socket:/run/postgresql
      - ${A2FLOW_PRIVATE}/bootstrap:/run/selfhost:ro
    command: [databases]
    restart: 'no'
  management-migrate:
    image: a2flow-selfhost-management:${A2FLOW_IMAGE_TAG:-local}
    build: {context: ../.., dockerfile: deploy/selfhost/Dockerfile, target: management}
    user: "${A2FLOW_APP_UID}:${A2FLOW_APP_GID}"
    network_mode: none
    profiles: [tools]
    volumes:
      - postgres_socket:/run/postgresql
      - ${A2FLOW_PRIVATE}/management:/run/selfhost:ro
    command: [migrate]
    restart: 'no'
  management:
    image: a2flow-selfhost-management:${A2FLOW_IMAGE_TAG:-local}
    build: {context: ../.., dockerfile: deploy/selfhost/Dockerfile, target: management}
    user: "${A2FLOW_APP_UID}:${A2FLOW_APP_GID}"
    network_mode: service:gateway
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /native:size=32m,mode=0777,exec
    volumes:
      - postgres_socket:/run/postgresql
      - ${A2FLOW_PRIVATE}/management:/run/selfhost:ro
    depends_on: [gateway, postgres]
    restart: unless-stopped
  accounts:
    <<: *application
    command: [accounts]
    volumes:
      - postgres_socket:/run/postgresql
      - ${A2FLOW_PRIVATE}/accounts:/run/selfhost:ro
  bside:
    <<: *application
    command: [bside]
    volumes:
      - postgres_socket:/run/postgresql
      - ${A2FLOW_PRIVATE}/bside:/run/selfhost:ro
  runtime:
    <<: *application
    command: [runtime]
    volumes:
      - postgres_socket:/run/postgresql
      - ${A2FLOW_PRIVATE}/runtime:/run/selfhost:ro
  execution:
    <<: *application
    command: [execution]
    volumes:
      - postgres_socket:/run/postgresql
      - ${A2FLOW_PRIVATE}/execution:/run/selfhost:ro
  content:
    <<: *application
    command: [content]
    volumes:
      - postgres_socket:/run/postgresql
      - ${A2FLOW_PRIVATE}/content:/run/selfhost:ro
  management-agent:
    <<: *application
    command: [management-agent]
    volumes:
      - postgres_socket:/run/postgresql
      - ${A2FLOW_PRIVATE}/management-agent:/run/selfhost:ro
  scheduler:
    <<: *application
    command: [scheduler]
    volumes:
      - postgres_socket:/run/postgresql
      - ${A2FLOW_PRIVATE}/scheduler:/run/selfhost:ro
    depends_on:
      postgres: {condition: service_healthy}
      gateway: {condition: service_started}
      redis: {condition: service_started}
      bside: {condition: service_started}

volumes:
  postgres_data:
  postgres_socket:
  redis_data:
