name: ${A2FLOW_MANAGEMENT_PROJECT_NAME:-a2flow-management-prt}

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres@sha256:7bade6d532592ca8ce7ee32def7399dad2607c4ea5583839fc4352a095a11ea6
    network_mode: none
    environment:
      POSTGRES_DB: ${A2FLOW_MANAGEMENT_DATABASE_NAME:-a2flow_management_prt}
      POSTGRES_USER: ${A2FLOW_MANAGEMENT_DATABASE_USER:-a2flow_management}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command:
      - postgres
      - -c
      - listen_addresses=
      - -c
      - unix_socket_directories=/run/postgresql
      - -c
      - unix_socket_permissions=0777
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/run/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h /run/postgresql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  management:
    image: ${A2FLOW_MANAGEMENT_IMAGE:-a2flow-management-private:af13}
    build:
      context: ../..
      dockerfile: deploy/management/Dockerfile
      args:
        A2FLOW_UID: ${A2FLOW_MANAGEMENT_UID:?set the numeric owner of the management secret files}
        A2FLOW_GID: ${A2FLOW_MANAGEMENT_GID:?set the numeric group of the management secret files}
    network_mode: host
    user: "${A2FLOW_MANAGEMENT_UID}:${A2FLOW_MANAGEMENT_GID}"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &management_environment
      A2FLOW_MANAGEMENT_DATABASE_SOCKET_DIRECTORY: /run/postgresql
      A2FLOW_MANAGEMENT_DATABASE_NAME: ${A2FLOW_MANAGEMENT_DATABASE_NAME:-a2flow_management_prt}
      A2FLOW_MANAGEMENT_DATABASE_USER: ${A2FLOW_MANAGEMENT_DATABASE_USER:-a2flow_management}
      A2FLOW_MANAGEMENT_POSTGRES_PASSWORD_FILE: /run/secrets/management_postgres_password
      A2FLOW_MANAGEMENT_ENVIRONMENT: PRT
      A2FLOW_MANAGEMENT_ASSET_NAMESPACE: ${A2FLOW_MANAGEMENT_ASSET_NAMESPACE:-a2flow-mvp-activity-planning}
      A2FLOW_MANAGEMENT_VALIDATOR_FACTORY: activity_planning_demo:bundle_validator
      A2FLOW_MANAGEMENT_USER_ID: ${A2FLOW_MANAGEMENT_USER_ID:-101}
      A2FLOW_MANAGEMENT_ROLES: ADMIN
      A2FLOW_MANAGEMENT_AUTH_TOKEN_FILE: /run/secrets/management_auth_token
      A2FLOW_MANAGEMENT_GUEST_TOKEN_FILE: /run/secrets/management_guest_token
      A2FLOW_MANAGEMENT_GUEST_USER_ID: ${A2FLOW_MANAGEMENT_GUEST_USER_ID:-102}
      A2FLOW_MANAGEMENT_STATIC_DIRECTORY: /opt/a2flow/static
      A2FLOW_MANAGEMENT_BROWSER_ORIGIN: ${A2FLOW_MANAGEMENT_BROWSER_ORIGIN:-http://127.0.0.1:${A2FLOW_MANAGEMENT_BROWSER_PORT:-14177}}
      A2FLOW_MANAGEMENT_LISTEN_PORT: ${A2FLOW_MANAGEMENT_HOST_PORT:-8766}
    secrets:
      - management_postgres_password
      - management_auth_token
      - management_guest_token
    volumes:
      - postgres_socket:/run/postgresql
      - type: bind
        source: ${A2FLOW_MANAGEMENT_STATIC_HOST_DIRECTORY:?set the absolute built management UI directory}
        target: /opt/a2flow/static
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['A2FLOW_MANAGEMENT_LISTEN_PORT']+'/private-preview/login',timeout=2).read(1)"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

  initialize:
    image: ${A2FLOW_MANAGEMENT_IMAGE:-a2flow-management-private:af13}
    build:
      context: ../..
      dockerfile: deploy/management/Dockerfile
      args:
        A2FLOW_UID: ${A2FLOW_MANAGEMENT_UID:?set the numeric owner of the management secret files}
        A2FLOW_GID: ${A2FLOW_MANAGEMENT_GID:?set the numeric group of the management secret files}
    profiles: ["tools"]
    network_mode: none
    user: "${A2FLOW_MANAGEMENT_UID}:${A2FLOW_MANAGEMENT_GID}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *management_environment
    secrets:
      - management_postgres_password
    volumes:
      - postgres_socket:/run/postgresql
    command: ["initialize"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

secrets:
  postgres_password:
    file: ${A2FLOW_MANAGEMENT_SECRET_DIRECTORY:?set an absolute private secret directory}/postgres_password
  management_postgres_password:
    file: ${A2FLOW_MANAGEMENT_SECRET_DIRECTORY:?set an absolute private secret directory}/management_postgres_password
  management_auth_token:
    file: ${A2FLOW_MANAGEMENT_SECRET_DIRECTORY:?set an absolute private secret directory}/management_auth_token
  management_guest_token:
    file: ${A2FLOW_MANAGEMENT_SECRET_DIRECTORY:?set an absolute private secret directory}/management_guest_token

volumes:
  postgres_data:
  postgres_socket:
