name: Python quality (typed subset)

on:
  pull_request:
    paths:
      - "packages/**/*.py"
      - "services/**/*.py"
      - "pyproject.toml"
      - "requirements-quality.lock"
      - "Makefile"
      - ".github/workflows/python-quality.yml"
  push:
    branches: [main]
    paths:
      - "packages/**/*.py"
      - "services/**/*.py"
      - "pyproject.toml"
      - "requirements-quality.lock"
      - "Makefile"
      - ".github/workflows/python-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-quality.lock
      - run: python -m pip install --requirement requirements-quality.lock
      - run: make quality-python
