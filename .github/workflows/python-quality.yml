name: Python quality

on:
  pull_request:
    paths:
      - "packages/**/*.py"
      - "services/**/*.py"
      - "pyproject.toml"
      - "requirements-quality.lock"
      - "Makefile"
      - ".github/workflows/python-quality.yml"
  push:
    branches: [main]
    paths:
      - "packages/**/*.py"
      - "services/**/*.py"
      - "pyproject.toml"
      - "requirements-quality.lock"
      - "Makefile"
      - ".github/workflows/python-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-quality.lock
      - run: python -m pip install --requirement requirements-quality.lock
      - run: make quality-python
