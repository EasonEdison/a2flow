[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
mypy_path = "packages/contracts/src:packages/asset-store/src"
files = [
  "packages/contracts/src/skillweave_contracts/asset_types.py",
  "packages/asset-store/src/a2flow_asset_store/records.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
