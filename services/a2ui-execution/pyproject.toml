[build-system]
requires = ["setuptools>=68", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "a2flow-a2ui-execution"
version = "0.1.0"
description = "Published A2UI v0.9.1 execution runtime"
requires-python = ">=3.11"
dependencies = [
    "a2flow-capability-execution==0.1.0",
    "jsonschema>=4.26,<5",
    "pydantic>=2.12,<3",
    "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
rpc = ["a2flow-rpc-contracts==0.1.0", "grpcio==1.75.1"]
test = [
    "mypy==1.19.1",
    "pytest>=8,<9",
    "ruff>=0.13,<0.17",
    "types-jsonschema>=4.26,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
a2flow_a2ui = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "../capability-execution/src", "../../packages/rpc-contracts/src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
