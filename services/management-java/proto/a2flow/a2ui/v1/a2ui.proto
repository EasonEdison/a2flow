syntax = "proto3";
package a2flow.a2ui.v1;
option java_package = "dev.a2flow.management.a2ui.runtime.proto";
option java_multiple_files = true;
import "a2flow/capability/v1/capability.proto";

message ApplicationRelease {
  string app_code = 1;
  string source_id = 2;
  string digest = 3;
  string app_build_id = 4;
  a2flow.capability.v1.Environment environment = 5;
}
message RuntimeSession {
  string token = 1;
  string app_build_id = 2;
  string protocol_version = 3;
  string catalog_id = 4;
  string catalog_revision = 5;
  string catalog_digest = 6;
}
// Only the authenticated Python runtime may populate this from persisted card state.
message TrustedCard {
  optional int64 user_id = 1;
  reserved 2, 3, 4;
  reserved "release", "session", "revision";
  bytes params_json = 5;
  bytes snapshot_json = 6;
  string app_code = 7;
}
message ActivateRequest {
  a2flow.capability.v1.ExecutionContext context = 1;
  string app_code = 2;
  bytes params_json = 3;
  reserved 4, 5;
  reserved "expected_source_id", "expected_digest";
}
message DescribeRequest {
  a2flow.capability.v1.ExecutionContext context = 1;
  string app_code = 2;
}
message CatalogDescriptor {
  string protocol_version = 1;
  string catalog_id = 2;
  string catalog_revision = 3;
  string catalog_digest = 4;
}
message DescribeResponse {
  ApplicationRelease release = 1;
  bytes params_schema_json = 2;
  string interaction_mode = 3;
  repeated ActionDescriptor actions = 4;
  CatalogDescriptor catalog = 5;
  string error_code = 6;
}
message ActRequest {
  a2flow.capability.v1.ExecutionContext context = 1;
  TrustedCard card = 2;
  string correlation_id = 3;
  reserved 4, 5, 6;
  reserved "runtime_session_token", "app_build_id", "expected_surface_revision";
  string idempotency_key = 7;
  bytes action_message_json = 8;
}
message ActionDescriptor {
  string surface_id = 1;
  string component_id = 2;
  string action_name = 3;
  bytes context_schema_json = 4;
}
message ExecutionSummary {
  string binding_id = 1;
  string action_code = 2;
  bool success = 3;
  int32 capability_version = 4;
  string error_code = 5;
}
message ActionExecutionObservation {
  string binding_id = 1;
  string action_code = 2;
  bytes arguments_json = 3;
  bytes result_json = 4;
  bool capability_success = 5;
  optional bool business_success = 6;
  string capability_error_code = 7;
  string presentation_error_code = 8;
}
message ComposerDraftEffect {
  string type = 1;
  string mode = 2;
  string request_id = 3;
  string text = 4;
}
message RuntimeResponse {
  ApplicationRelease release = 1;
  bytes params_json = 2;
  bytes messages_json = 3;
  bytes snapshot_json = 4;
  repeated ExecutionSummary executions = 5;
  repeated ActionDescriptor actions = 6;
  bool complete_interaction = 7;
  string selected_branch_id = 8;
  string error_code = 9;
  CatalogDescriptor catalog = 10;
  RuntimeSession session = 11;
  string interaction_mode = 12;
  bool business_success = 13;
  ActionExecutionObservation action_observation = 14;
  repeated ComposerDraftEffect composer_draft_effects = 15;
}
service A2uiExecution {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Activate(ActivateRequest) returns (RuntimeResponse);
  rpc Act(ActRequest) returns (RuntimeResponse);
}
