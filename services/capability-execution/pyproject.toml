[build-system]
requires = ["setuptools>=68", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "a2flow-capability-execution"
version = "0.1.0"
description = "Typed execution kernel for published A2Flow gRPC capabilities"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["mypy==1.19.1", "pytest>=8,<9", "ruff>=0.13,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
